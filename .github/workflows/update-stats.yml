name: Update audience statistics
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-stats.yml'
      - 'scripts/update-stats.mjs'
      - 'scripts/update-stats.test.mjs'
permissions:
  contents: write
concurrency:
  group: audience-statistics
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test provider failure handling
        run: node --test scripts/update-stats.test.mjs
      - name: Fetch statistics
        id: refresh
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
        run: node scripts/update-stats.mjs
      - name: Save successful snapshots
        run: |
          git add public/content/stats.json docs/content/stats.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public audience statistics'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report provider outage
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'One provider failed. Successful snapshots were saved and previous values retained.'
          exit 1
